spring.application.name=modashop
# Conexión a MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Usuario para las rutas /api/admin/** (página de almacén)
spring.security.user.name=almacen
spring.security.user.password=${ADMIN_PASSWORD:cambia-esta-clave}
spring.security.user.roles=ADMIN

# Subida de imágenes
app.uploads-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
